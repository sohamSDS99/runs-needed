name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 14 from PRD section 10. Runs first and independently of the Node build,
  # because it re-derives every fixture from primary tooling rather than from
  # this repository's own code. If this job fails, nothing else matters.
  # ---------------------------------------------------------------------------
  statistics:
    name: Independent statistical verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SciPy and statsmodels
        run: pip install --quiet scipy statsmodels

      - name: Verify every fixture (457 assertions)
        run: python3 scripts/verify_fixtures.py

      - name: Confirm verifiers were not modified
        run: |
          git diff --exit-code \
            scripts/verify_fixtures.py \
            scripts/verify_fixtures.R \
            scripts/coverage.py \
            scripts/monotonicity.py

      - name: Reproduce the coverage claim in STATS_SPEC section 3.2
        run: python3 scripts/coverage.py | grep -q '0.0955'

      - name: Reproduce the monotonicity claim in STATS_SPEC section 4.2
        run: python3 scripts/monotonicity.py | grep -q '^PASS'

  documents:
    name: Specification hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: No placeholder markers in prose
        run: node scripts/check-no-placeholders.mjs

  build:
    name: Types, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    needs: [statistics, documents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No server-side output was emitted
        run: node scripts/check-static.mjs
      - name: Bundle within budget
        run: node scripts/check-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 5

  e2e:
    name: End-to-end and accessibility (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
